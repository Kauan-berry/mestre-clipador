[clipador]
# ============================================================
#  CLIPADOR - configuracao (veja o README.md)
# ============================================================

# Link da live. Pode ser o canal + /live (pega a live que estiver no ar)
# ou o link exato da live. YouTube, Twitch e Kick funcionam.
# Exemplo: https://www.youtube.com/@nomedocanal/live
link_da_live =

# Credito ao criador (aparece em cima do jogo). Ex.: via @nomedocanal
# (so texto: emoji aparece como quadradinho no video)
credito_no_video =
# Credito que vai na legenda sugerida (pra copiar e colar). Ex.: 🎥 @nomedocanal
credito_na_legenda =

# Telegram (veja o README, passo 3). NUNCA publique o seu token!
telegram_token =
telegram_chat_id =

# --- Visual ---
# desfocado = video inteiro, com fundo desfocado
# quadrado  = jogo maior, corta um pouco das laterais
# cheio     = tela toda, corta bastante das laterais
formato = desfocado

# Moldura de fundo: um PNG 1080x1920 na pasta do programa (use o molde_moldura.png
# como guia). Vazio = sem moldura (fundo desfocado).
moldura =

# Camera do streamer: x,y,largura,altura em % da tela da live. Vazio = desligado.
# Ex.: camera no canto superior direito = 74.5,1.2,24.8,30
camera =
# Largura da camera no clipe, em pixels (a tela tem 1080)
camera_largura = 460

# --- Quantos clipes e de que tamanho ---
# A cada X minutos de live ele escolhe os melhores momentos
minutos_por_bloco = 10
# Sempre manda pelo menos o minimo (para voce ter opcoes) e no maximo o max
minimo_clipes_por_bloco = 3
max_clipes_por_bloco = 5
# Quanto mais alto, mais exigente (95 = mais clipes, 99 = so momentos muito fortes)
rigor = 98
# Quanto o pico precisa estar acima do volume normal da live (em dB)
sensibilidade = 7
# Precisa ser >= ao tamanho do clipe para os clipes nao se repetirem
intervalo_minimo_entre_clipes = 30
# Tamanho do clipe = antes + depois (padrao: 30 segundos)
segundos_antes_do_pico = 20
segundos_depois_do_pico = 10

# --- Legenda e qualidade ---
legenda_automatica = yes
# small = boa qualidade; base = mais rapido se o PC sofrer
modelo_legenda = small
qualidade_maxima = 720
# Apaga a gravacao bruta depois de processar (economiza disco)
apagar_gravacoes_antigas = yes

# Se o YouTube bloquear ("confirm you're not a bot"), escreva: firefox
cookies_do_navegador =
