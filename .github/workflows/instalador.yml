name: instalador-windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bibliotecas
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy requests faster-whisper pywebview

      - name: Empacotar (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --windowed --name mestre-clipador
          --icon build/icone.ico --add-data "app/ui;ui" --paths app
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all av
          --collect-all onnxruntime --collect-all tokenizers --collect-all webview
          app/main.py

      - name: Embutir ffmpeg, yt-dlp e deno
        shell: pwsh
        run: |
          $bin = "dist/mestre-clipador/bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$bin/yt-dlp.exe"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination $bin
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath $bin
          Get-ChildItem $bin

      - name: Teste rapido do app empacotado
        shell: pwsh
        run: |
          $env:MC_SEM_JANELA = "1"; $env:MC_PORTA = "8799"; $env:MC_DADOS = "$env:RUNNER_TEMP\mc"
          $p = Start-Process -FilePath "dist/mestre-clipador/mestre-clipador.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/api/estado; $ok = $true; break } catch {}
          }
          $html = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { Get-Content "$env:RUNNER_TEMP\mc\log.txt" -ErrorAction SilentlyContinue; throw "o app nao respondeu" }
          if ($html -notmatch "mestre") { throw "a tela nao carregou" }
          "App respondeu: versao $($r.versao)"
          & "dist/mestre-clipador/bin/ffmpeg.exe" -version | Select-Object -First 1
          & "dist/mestre-clipador/bin/yt-dlp.exe" --version

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/instalador.iss
          Get-ChildItem build/Output

      - uses: actions/upload-artifact@v4
        with:
          name: mestre-clipador-setup
          path: build/Output/*.exe

      - name: Publicar no Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: mestre-clipador ${{ github.ref_name }}
          files: build/Output/*.exe
          body: |
            Instalador do mestre-clipador para Windows 10/11.
            Baixe o `mestre-clipador-setup-*.exe`, abra e siga o Avançar.
            O Windows pode avisar "O Windows protegeu o computador" (o app não tem assinatura digital paga): clique em Mais informações > Executar assim mesmo.
